[package]
name = "bridge-agent"
version = "0.10.2"
edition = "2021"
default-run = "bridge-agent"

[build-dependencies]
serde_json = { version = "1.0", features = ["raw_value"] }
toml = "0.8"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
relay = { git = "https://gitee.com/zxflimit/relay.git", rev = "ca7cfc8c291cf438d046688521c43b5c3ed0733a", default-features = false }
anyhow = "1.0"
axum = "0.8"
baijimu-cmodel-core = { version = "=5.0.0", git = "https://gitee.com/zxflimit_admin/baijimu-contracts.git", rev = "213e7efbcc06984820690e87a2cd27f6d552254b" }
baijimu-cmodel-http = { version = "=5.0.0", git = "https://gitee.com/zxflimit_admin/baijimu-contracts.git", rev = "213e7efbcc06984820690e87a2cd27f6d552254b" }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
futures-util = "0.3"
fs2 = "0.4"
sysinfo = "0.33"
local-app-contract = { git = "https://gitee.com/zxflimit_admin/local-app-contract.git", rev = "128e7a2fbf4550aca483d67d94fcd045387e863f", version = "=3.0.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
pep440_rs = "0.7.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3.20"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keyring = "4.1.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[[bin]]
name = "bridge-agent-environment-identity-migration"
path = "migration-artifacts/environment-identity/main.rs"
