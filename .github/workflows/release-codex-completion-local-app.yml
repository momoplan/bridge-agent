name: release-codex-completion-local-app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag, for example codex-completion-local-app-v1.0.1
        required: true
        type: string
      connector_ref:
        description: Immutable baijimu-connector-codex-completion tag, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      CONNECTOR_REF: ${{ inputs.connector_ref }}
    steps:
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            codex-completion-local-app-v*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          version="${RELEASE_TAG#codex-completion-local-app-v}"
          test "$CONNECTOR_REF" = "v${version}"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Baijimu Codex Completion Local App ${RELEASE_TAG#codex-completion-local-app-v}"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft \
              --title "Baijimu Codex Completion Local App ${RELEASE_TAG#codex-completion-local-app-v}" \
              --notes "Signed Baijimu Codex Completion local application release."
          fi

  build:
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runner: macos-15-intel
            platform_dir: macos
          - name: windows-x64
            runner: windows-latest
            platform_dir: windows-x86_64
          - name: linux-x64
            runner: ubuntu-22.04
            platform_dir: linux-x86_64
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      CONNECTOR_REF: ${{ inputs.connector_ref }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable
          if [ "$RUNNER_OS" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Checkout immutable connector source
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.BAIJIMU_CLI_RS_GIT_TOKEN }}
        run: |
          set -euo pipefail
          : "${GITEE_TOKEN:?BAIJIMU_CLI_RS_GIT_TOKEN is required}"
          source_dir="$RUNNER_TEMP/baijimu-connector-codex-completion"
          git clone --depth 1 --branch "$CONNECTOR_REF" \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/zxflimit_admin/baijimu-connector-codex-completion.git" \
            "$source_dir"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$source_dir/Cargo.toml" | head -1)"
          test "$RELEASE_TAG" = "codex-completion-local-app-v${version}"
          test "$CONNECTOR_REF" = "v${version}"
          test "$(jq -r .version "$source_dir/connector.json")" = "$version"
          test "$(jq -r .source.revision "$source_dir/connector.json")" = "$CONNECTOR_REF"
          echo "CONNECTOR_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run Rust release quality gate
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/baijimu-connector-codex-completion"
          cargo fmt --manifest-path "$source_dir/Cargo.toml" -- --check
          cargo test --locked --manifest-path "$source_dir/Cargo.toml"
          cargo clippy --locked --manifest-path "$source_dir/Cargo.toml" --all-targets -- -D warnings

      - name: Build macOS universal binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/baijimu-connector-codex-completion"
          MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --locked --release \
            --target aarch64-apple-darwin --manifest-path "$source_dir/Cargo.toml"
          MACOSX_DEPLOYMENT_TARGET=10.13 cargo build --locked --release \
            --target x86_64-apple-darwin --manifest-path "$source_dir/Cargo.toml"
          bin_dir="$RUNNER_TEMP/codex-completion-local-app/bin/${{ matrix.platform_dir }}"
          mkdir -p "$bin_dir"
          lipo -create \
            "$source_dir/target/aarch64-apple-darwin/release/baijimu-connector-codex-completion" \
            "$source_dir/target/x86_64-apple-darwin/release/baijimu-connector-codex-completion" \
            -output "$bin_dir/baijimu-connector-codex-completion"
          chmod 755 "$bin_dir/baijimu-connector-codex-completion"

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Xiaofeng Zhang (H82D8SYZ94)"
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!name}" ] || { echo "Missing $name" >&2; exit 1; }
          done
          certificate_path="$RUNNER_TEMP/codex-completion-certificate.p12"
          keychain_path="$RUNNER_TEMP/codex-completion-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          binary="$RUNNER_TEMP/codex-completion-local-app/bin/${{ matrix.platform_dir }}/baijimu-connector-codex-completion"
          bash .github/scripts/sign-macos-with-retry.sh \
            "$binary" \
            "$APPLE_SIGNING_IDENTITY"
          lipo -info "$binary"

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = Join-Path $env:RUNNER_TEMP "baijimu-connector-codex-completion"
          cargo build --locked --release --manifest-path (Join-Path $sourceDir "Cargo.toml")
          $binDir = Join-Path $env:RUNNER_TEMP "codex-completion-local-app\bin\${{ matrix.platform_dir }}"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item -Force `
            (Join-Path $sourceDir "target\release\baijimu-connector-codex-completion.exe") `
            (Join-Path $binDir "baijimu-connector-codex-completion.exe")

      - name: Sign Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          WINDOWS_SIGNING_ENABLED: "true"
          WINDOWS_SIGNING_DESCRIPTION: "Baijimu Codex Completion Local App"
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("SSL_COM_USERNAME", "SSL_COM_PASSWORD", "SSL_COM_CREDENTIAL_ID", "SSL_COM_TOTP_SECRET")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing $name"
            }
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri "https://ssl.com/wp-content/uploads/2024/10/CodeSignTool-v1.3.1-windows.zip" `
            -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) GitHub-Actions" `
            -MaximumRetryCount 3 -RetryIntervalSec 5 -OutFile $zipPath
          $expected = "e45a9e6c2aac4cae16c114eb590a2196406681357eb587507c65cd3646b5330d"
          if ((Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant() -ne $expected) {
            throw "CodeSignTool checksum mismatch"
          }
          Expand-Archive -Force -Path $zipPath -DestinationPath $extractPath
          $tool = Get-ChildItem -Path $extractPath -Filter "CodeSignTool.bat" -Recurse -File |
            Select-Object -First 1
          if (-not $tool) { throw "Unable to locate CodeSignTool.bat" }
          $env:CODESIGN_TOOL_PATH = $tool.FullName
          $binary = Join-Path $env:RUNNER_TEMP "codex-completion-local-app\bin\${{ matrix.platform_dir }}\baijimu-connector-codex-completion.exe"
          & "src-tauri/scripts/sign-windows-artifact.ps1" -FilePath $binary
          if ((Get-AuthenticodeSignature -LiteralPath $binary).Status -ne "Valid") {
            throw "Invalid Windows signature"
          }

      - name: Build Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/baijimu-connector-codex-completion"
          cargo build --locked --release --manifest-path "$source_dir/Cargo.toml"
          bin_dir="$RUNNER_TEMP/codex-completion-local-app/bin/${{ matrix.platform_dir }}"
          mkdir -p "$bin_dir"
          install -m 755 "$source_dir/target/release/baijimu-connector-codex-completion" \
            "$bin_dir/baijimu-connector-codex-completion"

      - name: Assemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/baijimu-connector-codex-completion"
          package_dir="$RUNNER_TEMP/codex-completion-local-app"
          cp "$source_dir/connector.json" "$source_dir/README.md" "$source_dir/LICENSE" "$package_dir/"
          node - "$package_dir/connector.json" "$CONNECTOR_VERSION" <<'NODE'
          const fs = require("fs");
          const [manifestPath, version] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (
            manifest.schemaVersion !== "2.0" ||
            manifest.version !== version ||
            manifest.source?.revision !== `v${version}` ||
            manifest.services !== undefined ||
            manifest.serviceRegistrationFiles !== undefined ||
            manifest.runtime?.type !== "process" ||
            !Array.isArray(manifest.methods) ||
            manifest.methods.length === 0 ||
            !manifest.methods.every((method) =>
              ["cmodel", "plain", "passthrough"].includes(method.responseMode)
            )
          ) {
            throw new Error("invalid Codex Completion local-app release manifest");
          }
          NODE
          binary_name="baijimu-connector-codex-completion"
          [ "$RUNNER_OS" != "Windows" ] || binary_name="${binary_name}.exe"
          binary="$package_dir/bin/${{ matrix.platform_dir }}/$binary_name"
          test -s "$binary"
          if [ "$RUNNER_OS" != "Windows" ]; then
            test "$("$binary" --version)" = "$CONNECTOR_VERSION"
          fi
          output="$RUNNER_TEMP/baijimu-codex-completion-connector-${CONNECTOR_VERSION}-${{ matrix.name }}.zip"
          cd "$package_dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Force -Path '*' -DestinationPath '$output'"
            checksum="$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$output').Hash.ToLowerInvariant()")"
          else
            zip -r "$output" .
            checksum="$(shasum -a 256 "$output" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$checksum" "$(basename "$output")" > "$output.sha256"
          echo "RELEASE_ASSET=$output" >> "$GITHUB_ENV"

      - name: Upload immutable release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    needs: build
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
