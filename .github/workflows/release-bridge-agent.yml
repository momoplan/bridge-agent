name: release-bridge-agent

on:
  push:
    tags:
      - "bridge-agent-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry or repair, for example bridge-agent-v0.1.110
        required: true
        type: string
      repair_assets_only:
        description: Reuse the existing signed GitHub Release assets and repair OSS distribution and updater metadata
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bridge-agent-release
  cancel-in-progress: false

jobs:
  prepare-domestic-release:
    name: Prepare domestic release
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Validate immutable release source
        shell: bash
        env:
          REPAIR_ASSETS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_assets_only || false }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            bridge-agent-v*) ;;
            *)
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          version="${RELEASE_TAG#bridge-agent-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          assert_version() {
            local label="$1"
            local actual="$2"
            if [ "$actual" != "$version" ]; then
              echo "$label version $actual does not match release tag $RELEASE_TAG" >&2
              exit 1
            fi
          }

          if [ "$REPAIR_ASSETS_ONLY" != "true" ]; then
            assert_version package.json "$(node -p 'require("./package.json").version')"
            assert_version src-tauri/tauri.conf.json "$(node -p 'require("./src-tauri/tauri.conf.json").version')"
            assert_version Cargo.toml "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
            assert_version src-tauri/Cargo.toml "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
            assert_version tools/windows-uninstaller/Cargo.toml "$(sed -n 's/^version = "\([^"]*\)"/\1/p' tools/windows-uninstaller/Cargo.toml | head -1)"
          fi

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag_commit="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" || true)"
          if [ -z "$tag_commit" ]; then
            echo "Release tag $RELEASE_TAG is not available in the GitHub repository" >&2
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Release tag $RELEASE_TAG points to $tag_commit, expected $GITHUB_SHA" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "Release commit $GITHUB_SHA must already belong to GitHub main" >&2
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"; then
              echo "Repair source $GITHUB_SHA must descend from immutable tag $RELEASE_TAG ($tag_commit)" >&2
              exit 1
            fi
          fi

          cli_version="$(tr -d '[:space:]' < tools/baijimu-cli/VERSION)"
          case "$cli_version" in
            *[!0-9.]*|'')
              echo "Invalid bundled Baijimu CLI version: $cli_version" >&2
              exit 1
              ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            for target in \
              "macos&arch=aarch64" \
              "windows&arch=x86_64" \
              "linux&arch=x86_64"; do
              market_cli_version="$(
                curl -fsSL --retry 3 --retry-delay 2 \
                  "https://api.baijimu.com/lowcode3/api/local-app-market/apps?platform=${target}" \
                  | jq -er '
                    .[]
                    | select(
                        .connectorId == "com.baijimu.cli"
                        and .latestVersion.manifest.applicationType == "managed_tool"
                      )
                    | select(.latestVersion.repo == "momoplan/baijimu-cli-rs")
                    | select(.latestVersion.revision == ("v" + .latestVersion.version))
                    | select(all(.latestVersion.manifest.artifacts[];
                        .source | startswith("https://download.baijimu.com/managed-tool-artifacts/baijimu-cli/releases/")))
                    | .latestVersion.version
                  '
              )"
              if [ "$market_cli_version" != "$cli_version" ]; then
                echo "Bundled Baijimu CLI $cli_version is not the latest market version $market_cli_version for $target" >&2
                exit 1
              fi
            done
          fi

      - name: Upsert domestic release
        shell: bash
        env:
          BRIDGE_AGENT_RELEASE_API_URL: ${{ secrets.BRIDGE_AGENT_RELEASE_API_URL }}
          BRIDGE_AGENT_RELEASE_API_TOKEN: ${{ secrets.BRIDGE_AGENT_RELEASE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in BRIDGE_AGENT_RELEASE_API_URL BRIDGE_AGENT_RELEASE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          api="$(node .github/scripts/release-service-url.mjs release "$BRIDGE_AGENT_RELEASE_API_URL")"
          version="${RELEASE_TAG#bridge-agent-v}"

          curl -fsSL --post301 --post302 --post303 --retry 3 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $BRIDGE_AGENT_RELEASE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"tagName\":\"$RELEASE_TAG\",\"version\":\"$version\",\"releaseName\":\"百积木 $RELEASE_TAG\",\"source\":\"github-actions\"}" \
            "$api/releases/$RELEASE_TAG"

  quality-gate:
    name: Release quality gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_assets_only }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          # A repair release is dispatched from the fixed main commit while keeping
          # the existing immutable release tag only as the artifact version.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust quality tools
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Install Tauri Linux dependencies
        run: .github/scripts/install-linux-release-dependencies.sh

      - name: Run release checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path tools/windows-uninstaller/Cargo.toml -- --check
          cargo test --workspace
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo check --release --manifest-path src-tauri/Cargo.toml

  windows-quality-gate:
    name: Windows release quality gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_assets_only }}
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Test Microsoft Defender signature update retries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "src-tauri/scripts/update-defender-signatures.test.ps1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust quality tools
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy --no-self-update
          rustup default stable

      - name: Build frontend for Tauri context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          $env:TAURI_ENV_PLATFORM = "windows"
          npm run prepare:windows-uninstaller:quality

      - name: Check Windows Rust targets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          # Shell lifecycle tests exercise real child-process and pipe handling.
          # Keep the Windows quality gate deterministic instead of competing with
          # the connector installation tests for process and I/O resources.
          cargo test --locked --workspace -- --test-threads=1
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml codex_skill::tests::installs_bundled_skill_in_user_skill_directory -- --exact
          cargo test --locked --manifest-path src-tauri/Cargo.toml managed_tool::tests::windows_registry_path_registration_round_trips -- --exact
          cargo fmt --manifest-path tools/windows-uninstaller/Cargo.toml -- --check
          cargo test --locked --manifest-path tools/windows-uninstaller/Cargo.toml

  release:
    name: ${{ matrix.name }}
    needs: [prepare-domestic-release, quality-gate, windows-quality-gate]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_assets_only }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            runner: macos-15-intel
            tauri_args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            tauri_args: --bundles msi
            rust_targets: ""
          - name: Linux x64
            runner: ubuntu-22.04
            tauri_args: --bundles appimage,deb
            rust_targets: ""
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Repair releases build the dispatched main commit, not the old tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-release-dependencies.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare bundled Baijimu CLI
        shell: bash
        env:
          BAIJIMU_CLI_USE_RELEASE_ASSET: "true"
        run: |
          set -euo pipefail
          ./tools/baijimu-cli/prepare-bundled-cli.sh

      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "SSL_COM_USERNAME",
            "SSL_COM_PASSWORD",
            "SSL_COM_CREDENTIAL_ID",
            "SSL_COM_TOTP_SECRET"
          )
          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Windows release requires code signing. Missing SSL.com secrets: $($missing -join ', ')"
          }
          "WINDOWS_SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare Windows signing tools
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "CodeSignTool"

          Invoke-WebRequest `
            -Uri "https://ssl.com/wp-content/uploads/2024/10/CodeSignTool-v1.3.1-windows.zip" `
            -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) GitHub-Actions" `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 5 `
            -OutFile $zipPath
          $expectedSha256 = "e45a9e6c2aac4cae16c114eb590a2196406681357eb587507c65cd3646b5330d"
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "CodeSignTool archive checksum mismatch: $actualSha256"
          }
          Expand-Archive -Force -Path $zipPath -DestinationPath $extractPath

          $codeSignTool = Get-ChildItem `
            -Path $extractPath `
            -Filter "CodeSignTool.bat" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $codeSignTool) {
            throw "Unable to locate CodeSignTool.bat"
          }
          "CODESIGN_TOOL_PATH=$($codeSignTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Push-Location $codeSignTool.DirectoryName
          try {
            & ".\CodeSignTool.bat" --version
          } finally {
            Pop-Location
          }

          $metadataVerifierZipPath = Join-Path $env:RUNNER_TEMP "osslsigncode.zip"
          $metadataVerifierExtractPath = Join-Path $env:RUNNER_TEMP "osslsigncode"
          Invoke-WebRequest `
            -Uri "https://github.com/mtrojnar/osslsigncode/releases/download/2.14/osslsigncode-2.14-windows-x64-mingw.zip" `
            -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) GitHub-Actions" `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 5 `
            -OutFile $metadataVerifierZipPath
          $expectedMetadataVerifierSha256 = "9a1722aaf62a27852c4eb9c35749a0248065052d0ae0a93d4ed6bb49def027f2"
          $actualMetadataVerifierSha256 = (
            Get-FileHash -Algorithm SHA256 -Path $metadataVerifierZipPath
          ).Hash.ToLowerInvariant()
          if ($actualMetadataVerifierSha256 -ne $expectedMetadataVerifierSha256) {
            throw "osslsigncode archive checksum mismatch: $actualMetadataVerifierSha256"
          }
          Expand-Archive `
            -Force `
            -Path $metadataVerifierZipPath `
            -DestinationPath $metadataVerifierExtractPath
          $metadataVerifier = Get-ChildItem `
            -Path $metadataVerifierExtractPath `
            -Filter "osslsigncode.exe" `
            -Recurse `
            -File | Select-Object -First 1
          if (-not $metadataVerifier) {
            throw "Unable to locate osslsigncode.exe"
          }
          "OSSLSIGNCODE_PATH=$($metadataVerifier.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $metadataVerifier.FullName --version
          if ($LASTEXITCODE -ne 0) {
            throw "osslsigncode version check failed with exit code $LASTEXITCODE"
          }

      - name: Prepare Apple notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Sign bundled Baijimu CLI
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Xiaofeng Zhang (H82D8SYZ94)"
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          cli_path="src-tauri/resources/bin/baijimu"
          if [ ! -x "$cli_path" ]; then
            echo "Bundled Baijimu CLI is missing or not executable: $cli_path" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/baijimu-cli-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/baijimu-cli-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          bash .github/scripts/sign-macos-with-retry.sh \
            "$cli_path" \
            "$APPLE_SIGNING_IDENTITY"
          lipo -info "$cli_path"

      - name: Validate release tag
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            bridge-agent-v*) ;;
            *)
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

      - name: Validate release service config
        shell: bash
        env:
          BRIDGE_AGENT_UPDATE_API_URL: ${{ secrets.BRIDGE_AGENT_UPDATE_API_URL }}
          BRIDGE_AGENT_RELEASE_API_URL: ${{ secrets.BRIDGE_AGENT_RELEASE_API_URL }}
          BRIDGE_AGENT_RELEASE_API_TOKEN: ${{ secrets.BRIDGE_AGENT_RELEASE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in BRIDGE_AGENT_UPDATE_API_URL BRIDGE_AGENT_RELEASE_API_URL BRIDGE_AGENT_RELEASE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done
          node .github/scripts/release-service-url.mjs update "$BRIDGE_AGENT_UPDATE_API_URL" >/dev/null
          node .github/scripts/release-service-url.mjs release "$BRIDGE_AGENT_RELEASE_API_URL" >/dev/null

      - name: Build release bundles
        id: build_release_bundles
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static -D warnings' || '-D warnings' }}
          BRIDGE_AGENT_UPDATE_API_URL: ${{ secrets.BRIDGE_AGENT_UPDATE_API_URL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Xiaofeng Zhang (H82D8SYZ94)"
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          WINDOWS_SIGNING_ENABLED: ${{ env.WINDOWS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_DESCRIPTION: "百积木"
          WINDOWS_SIGNING_LOG_PATH: ${{ runner.temp }}/windows-signing.log
          # Tauri otherwise adds --skip-jenkins whenever GitHub Actions sets
          # CI=true, which copies the background asset but omits the Finder
          # .DS_Store that applies the background and icon positions.
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required updater signing secret: $name" >&2
              exit 1
            fi
          done
          npm run tauri -- build ${{ matrix.tauri_args }}

      - name: Diagnose Windows bundle failure
        if: ${{ failure() && runner.os == 'Windows' && steps.build_release_bundles.outcome == 'failure' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $signingLog = Join-Path $env:RUNNER_TEMP "windows-signing.log"
          if (Test-Path -LiteralPath $signingLog) {
            Write-Host "Windows signing diagnostics:"
            Get-Content -LiteralPath $signingLog
          } else {
            Write-Host "No Windows signing diagnostic log was produced"
          }

          $msiDirectory = "src-tauri/target/release/bundle/msi"
          if (Test-Path -LiteralPath $msiDirectory) {
            Get-ChildItem -LiteralPath $msiDirectory -File |
              Select-Object Name, Length, LastWriteTime |
              Format-Table -AutoSize
          }

          $candle = Get-ChildItem `
            -Path "src-tauri/target/release/wix" `
            -Filter "candle.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          $utilExtension = if ($candle) {
            Get-ChildItem `
              -Path $candle.Directory.FullName `
              -Filter "WixUtilExtension.dll" `
              -File `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $candle -or -not $utilExtension) {
            Write-Host "WiX compiler or WixUtilExtension was not found after bundle failure"
          } else {
            & $candle.FullName `
              -nologo `
              -arch x64 `
              -ext $utilExtension.FullName `
              "src-tauri/wix/bridge-agent-windows-runtime.wxs"
            Write-Host "WiX fragment diagnostic exit code: $LASTEXITCODE"

            $wixToolDirectory = $candle.Directory.FullName
            $wixBuildDirectory = Split-Path -Parent $wixToolDirectory
            $light = Join-Path $wixToolDirectory "light.exe"
            $uiExtension = Join-Path $wixToolDirectory "WixUIExtension.dll"
            $locale = Join-Path $wixBuildDirectory "locale.wxl"
            $wixObjects = @(
              Get-ChildItem `
                -LiteralPath $wixBuildDirectory `
                -Filter "*.wixobj" `
                -File `
                -ErrorAction SilentlyContinue
            )
            if (
              (Test-Path -LiteralPath $light) -and
              (Test-Path -LiteralPath $uiExtension) -and
              (Test-Path -LiteralPath $locale) -and
              $wixObjects.Count -gt 0
            ) {
              $diagnosticMsi = Join-Path $wixBuildDirectory "diagnostic-output.msi"
              $lightOutput = & $light `
                -nologo `
                -v `
                "-cultures:zh-cn;en-US" `
                -loc $locale `
                -ext $uiExtension `
                -ext $utilExtension.FullName `
                -out $diagnosticMsi `
                @($wixObjects.FullName) 2>&1
              $lightExitCode = $LASTEXITCODE
              $lightOutput | ForEach-Object { Write-Host $_ }
              Write-Host "WiX linker diagnostic exit code: $lightExitCode"
            } else {
              Write-Host "WiX linker diagnostic inputs were incomplete"
            }
          }

      - name: Verify macOS minimum system version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          intel_configured_min="10.13"
          apple_silicon_configured_min="11.0"
          dmg_dir="src-tauri/target/universal-apple-darwin/release/bundle/dmg"

          shopt -s nullglob
          dmg_files=("$dmg_dir"/*.dmg)
          if [ "${#dmg_files[@]}" -ne 1 ]; then
            echo "Expected one macOS DMG, found ${#dmg_files[@]}:" >&2
            printf ' - %s\n' "${dmg_files[@]}" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          hdiutil attach "${dmg_files[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          cleanup_mount() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$mount_dir"
          }
          trap cleanup_mount EXIT

          app_path="$mount_dir/百积木.app"
          if [ ! -d "$app_path" ]; then
            app_path="$(find "$mount_dir" -maxdepth 2 -name '*.app' -type d | head -n 1)"
          fi
          if [ -z "$app_path" ] || [ ! -d "$app_path" ]; then
            echo "Unable to locate app bundle inside ${dmg_files[0]}" >&2
            exit 1
          fi
          applications_link="$mount_dir/Applications"
          if [ ! -L "$applications_link" ] || [ "$(readlink "$applications_link")" != "/Applications" ]; then
            echo "macOS DMG must contain an Applications symlink for drag-to-install" >&2
            find "$mount_dir" -maxdepth 1 -mindepth 1 -print >&2
            exit 1
          fi
          if [ ! -s "$mount_dir/.DS_Store" ]; then
            echo "macOS DMG is missing the Finder layout that applies its background and icon positions" >&2
            find "$mount_dir" -maxdepth 2 -mindepth 1 -print >&2
            exit 1
          fi
          if [ ! -s "$mount_dir/.background/dmg-background.png" ]; then
            echo "macOS DMG is missing the branded drag-to-install background" >&2
            find "$mount_dir" -maxdepth 2 -mindepth 1 -print >&2
            exit 1
          fi
          if ! cmp -s "$mount_dir/.background/dmg-background.png" "src-tauri/images/dmg-background.png"; then
            echo "macOS DMG drag-to-install background does not match the versioned source asset" >&2
            exit 1
          fi
          info_plist="${app_path}/Contents/Info.plist"

          version_lte() {
            python3 - "$1" "$2" <<'PY'
          import sys
          def parts(value):
              return tuple(int(part) for part in value.split(".")[:3])
          left = parts(sys.argv[1])
          right = parts(sys.argv[2])
          size = max(len(left), len(right))
          left += (0,) * (size - len(left))
          right += (0,) * (size - len(right))
          sys.exit(0 if left <= right else 1)
          PY
          }

          verify_macho_min() {
            local binary="$1"
            local label="$2"
            if [ ! -x "$binary" ]; then
              echo "${label} is missing or not executable: ${binary}" >&2
              exit 1
            fi
            for arch in $(lipo -archs "$binary"); do
              local configured_min="$intel_configured_min"
              if [ "$arch" = "arm64" ]; then
                configured_min="$apple_silicon_configured_min"
              fi
              local min_version
              min_version="$(
                otool -arch "$arch" -l "$binary" | awk '
                  /LC_BUILD_VERSION/ { in_build = 1; in_min = 0; next }
                  in_build && /minos/ { print $2; exit }
                  /LC_VERSION_MIN_MACOSX/ { in_min = 1; in_build = 0; next }
                  in_min && /version/ { print $2; exit }
                '
              )"
              if [ -z "$min_version" ]; then
                echo "Unable to read ${label} ${arch} minimum macOS version" >&2
                exit 1
              fi
              if ! version_lte "$min_version" "$configured_min"; then
                echo "${label} ${arch} requires macOS ${min_version}, expected <= ${configured_min}" >&2
                exit 1
              fi
            done
          }

          if plist_min="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$info_plist" 2>/dev/null)"; then
            if ! version_lte "$plist_min" "$apple_silicon_configured_min"; then
              echo "LSMinimumSystemVersion=${plist_min}, expected <= ${apple_silicon_configured_min}" >&2
              exit 1
            fi
          else
            echo "LSMinimumSystemVersion not present; relying on Mach-O deployment target checks."
          fi

          verify_macho_min "${app_path}/Contents/MacOS/bridge-agent-desktop" "bridge-agent-desktop"
          verify_macho_min "${app_path}/Contents/Resources/resources/bin/baijimu" "bundled baijimu CLI"

      - name: Normalize public bundle names
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#bridge-agent-v}"

          normalize_one() {
            local label="$1"
            local expected_path="$2"
            shift 2
            local bundle_files=("$@")
            if [ "${#bundle_files[@]}" -eq 0 ]; then
              echo "No $label bundle found" >&2
              exit 1
            fi
            if [ "${#bundle_files[@]}" -gt 1 ]; then
              echo "Expected one $label bundle, found ${#bundle_files[@]}:" >&2
              printf ' - %s\n' "${bundle_files[@]}" >&2
              exit 1
            fi
            if [ "${bundle_files[0]}" != "$expected_path" ]; then
              source_signature="${bundle_files[0]}.sig"
              mv "${bundle_files[0]}" "$expected_path"
              if [ -f "$source_signature" ]; then
                mv "$source_signature" "${expected_path}.sig"
              fi
            fi
            test -f "$expected_path"
          }

          shopt -s nullglob
          case "${{ runner.os }}" in
            macOS)
              bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
              normalize_one "macOS dmg" \
                "$bundle_dir/Baijimu_${version}_universal.dmg" \
                "$bundle_dir"/*.dmg
              updater_dir="src-tauri/target/universal-apple-darwin/release/bundle/macos"
              normalize_one "macOS updater" \
                "$updater_dir/Baijimu_${version}_universal.app.tar.gz" \
                "$updater_dir"/*.app.tar.gz
              test -s "$updater_dir/Baijimu_${version}_universal.app.tar.gz.sig"
              ;;
            Windows)
              bundle_dir="src-tauri/target/release/bundle/msi"
              normalize_one "Windows msi" \
                "$bundle_dir/Baijimu_${version}_x64_zh-CN.msi" \
                "$bundle_dir"/*.msi
              test -s "$bundle_dir/Baijimu_${version}_x64_zh-CN.msi.sig"
              ;;
            Linux)
              appimage_dir="src-tauri/target/release/bundle/appimage"
              deb_dir="src-tauri/target/release/bundle/deb"
              normalize_one "Linux AppImage" \
                "$appimage_dir/Baijimu_${version}_amd64.AppImage" \
                "$appimage_dir"/*.AppImage
              test -s "$appimage_dir/Baijimu_${version}_amd64.AppImage.sig"
              normalize_one "Linux deb" \
                "$deb_dir/Baijimu_${version}_amd64.deb" \
                "$deb_dir"/*.deb
              ;;
            *)
              echo "Unsupported runner OS: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac

      - name: Verify Windows MSI desktop-owned runtime contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "src-tauri/scripts/verify-windows-app-icon.ps1" `
            -FilePath "src-tauri/target/release/bridge-agent-desktop.exe"
          $msiFiles = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/msi" `
            -Filter "*.msi" `
            -File `
            -ErrorAction Stop
          if ($msiFiles.Count -ne 1) {
            throw "Expected one Windows MSI artifact, found $($msiFiles.Count)"
          }
          & "src-tauri/scripts/verify-windows-msi.ps1" -FilePath $msiFiles[0].FullName

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $diagnosticFiles = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          foreach ($file in $diagnosticFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host "$($file.FullName): $($signature.Status) (intermediate exe)"
          }

          $requiredSignedExecutables = @(
            Get-ChildItem -Path "src-tauri/binaries" -Filter "bridge-agent-uninstaller-*.exe" -File -ErrorAction Stop
          )
          if ($requiredSignedExecutables.Count -ne 1) {
            throw "Expected one signed Windows uninstaller sidecar, found $($requiredSignedExecutables.Count)"
          }
          foreach ($file in $requiredSignedExecutables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host "$($file.FullName): $($signature.Status) (required signed sidecar)"
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)"
            }
          }

          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction Stop

          if ($files.Count -eq 0) {
            throw "No Windows MSI artifacts found to verify"
          }

          $signtool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter "signtool.exe" `
            -File `
            -Recurse `
            -ErrorAction Stop |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found"
          }
          if (
            [string]::IsNullOrWhiteSpace($env:OSSLSIGNCODE_PATH) -or
            -not (Test-Path -LiteralPath $env:OSSLSIGNCODE_PATH)
          ) {
            throw "Pinned osslsigncode metadata verifier was not found"
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host "$($file.FullName): $($signature.Status)"
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)"
            }

            $signatureDetails = (& $signtool.FullName verify /pa /v $file.FullName 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0) {
              Write-Host $signatureDetails
              throw "signtool verification failed for $($file.FullName)"
            }
            Write-Host $signatureDetails

            # signtool validates the Windows trust chain, digest, and timestamp,
            # but its verify output does not expose SpcSpOpusInfo. Use the pinned
            # osslsigncode parser to read that authenticated attribute directly.
            $metadataStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $metadataStartInfo.FileName = $env:OSSLSIGNCODE_PATH
            $metadataStartInfo.UseShellExecute = $false
            $metadataStartInfo.CreateNoWindow = $true
            $metadataStartInfo.RedirectStandardOutput = $true
            $metadataStartInfo.RedirectStandardError = $true
            $metadataStartInfo.StandardOutputEncoding = [System.Text.UTF8Encoding]::new($false)
            $metadataStartInfo.StandardErrorEncoding = [System.Text.UTF8Encoding]::new($false)
            $metadataStartInfo.ArgumentList.Add("verify")
            $metadataStartInfo.ArgumentList.Add("-in")
            $metadataStartInfo.ArgumentList.Add($file.FullName)
            $metadataProcess = [System.Diagnostics.Process]::new()
            $metadataProcess.StartInfo = $metadataStartInfo
            if (-not $metadataProcess.Start()) {
              throw "Unable to start osslsigncode metadata verifier"
            }
            $metadataStdout = $metadataProcess.StandardOutput.ReadToEndAsync()
            $metadataStderr = $metadataProcess.StandardError.ReadToEndAsync()
            $metadataProcess.WaitForExit()
            $metadataDetails = (
              $metadataStdout.GetAwaiter().GetResult() + "`n" +
              $metadataStderr.GetAwaiter().GetResult()
            )
            Write-Host $metadataDetails
            Write-Host "osslsigncode metadata verifier exit code: $($metadataProcess.ExitCode)"
            if ($metadataDetails -notmatch '(?m)^\s*Text description:\s*百积木\s*$') {
              throw "Authenticode description must be 百积木 for $($file.FullName)"
            }
          }

      - name: Scan signed Windows release with Microsoft Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cli = Resolve-Path "src-tauri/resources/bin/baijimu.exe"
          $msi = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/msi" `
            -Filter "*.msi" `
            -File `
            -ErrorAction Stop |
            Select-Object -First 1
          if (-not $msi) {
            throw "Windows MSI artifact was not found for Defender scan"
          }
          $files = @($cli.Path, $msi.FullName)
          & "src-tauri/scripts/verify-windows-defender.ps1" `
            -FilePath $files

      - name: Verify Windows executables are self-contained
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found"
          }
          $visualStudioRoot = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem `
            -Path "$visualStudioRoot\VC\Tools\MSVC" `
            -Filter "dumpbin.exe" `
            -File `
            -Recurse `
            -ErrorAction Stop | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }

          $executables = @(
            (Resolve-Path "src-tauri/target/release/bridge-agent-desktop.exe").Path,
            (Resolve-Path "src-tauri/resources/bin/baijimu.exe").Path
          )
          foreach ($executable in $executables) {
            $imports = (& $dumpbin.FullName /DEPENDENTS $executable 2>&1) -join "`n"
            Write-Host $imports
            if ($imports -match '(?i)\b(?:VCRUNTIME|MSVCP)\d*(?:_\d+)?\.dll\b') {
              throw "Windows executable requires the Visual C++ runtime: $executable"
            }
          }
          Write-Host "Verified Windows executables do not require VCRUNTIME/MSVCP"

      - name: Smoke test Windows service-to-desktop upgrade lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/msi" `
            -Filter "*.msi" `
            -File `
            -ErrorAction Stop | Select-Object -First 1
          if (-not $msi) {
            throw "Windows MSI artifact was not found for install smoke test"
          }

          $legacyDir = Join-Path $env:RUNNER_TEMP "baijimu-legacy-msi"
          New-Item -ItemType Directory -Path $legacyDir -Force | Out-Null
          & gh release download "bridge-agent-v0.2.22" `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "Baijimu_0.2.22_x64_en-US.msi" `
            --dir $legacyDir `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the 0.2.22 service-owned MSI"
          }
          $legacyMsi = Get-ChildItem -Path $legacyDir -Filter "*.msi" -File |
            Select-Object -First 1
          if (-not $legacyMsi) {
            throw "The 0.2.22 service-owned MSI was not downloaded"
          }

          $legacyInstallLog = Join-Path $env:RUNNER_TEMP "baijimu-msi-legacy-install.log"
          $upgradeLog = Join-Path $env:RUNNER_TEMP "baijimu-msi-upgrade.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "baijimu-msi-uninstall.log"
          $legacyInstalled = $false
          $upgradeInstalled = $false
          function Get-OptionalRegistryValue {
            param(
              [Parameter(Mandatory = $true)]
              [Microsoft.Win32.RegistryKey]$Hive,
              [Parameter(Mandatory = $true)]
              [string]$SubKey,
              [Parameter(Mandatory = $true)]
              [string]$Name
            )

            $key = $Hive.OpenSubKey($SubKey)
            if ($null -eq $key) {
              return $null
            }
            try {
              return $key.GetValue(
                $Name,
                $null,
                [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames
              )
            } finally {
              $key.Dispose()
            }
          }

          $legacyDesktopExecutable = "C:\Program Files\Baijimu\bridge-agent-desktop.exe"
          $desktopExecutable = "C:\Program Files\百积木\bridge-agent-desktop.exe"
          $legacyServiceExecutable = "C:\Program Files\Baijimu\bridge-agent-service.exe"
          $legacyDesktopBackup = Join-Path $env:RUNNER_TEMP "bridge-agent-desktop-0.2.22.exe"
          $configPath = "C:\ProgramData\Baijimu\BridgeAgent\agent-config.json"
          $userRunSubKey = "Software\Microsoft\Windows\CurrentVersion\Run"

          try {
            $legacyInstall = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList @("/i", "`"$($legacyMsi.FullName)`"", "/qn", "/norestart", "AUTOLAUNCHAPP=False", "/L*v", "`"$legacyInstallLog`"") `
              -Wait `
              -PassThru
            if ($legacyInstall.ExitCode -notin @(0, 3010)) {
              if (Test-Path -LiteralPath $legacyInstallLog) {
                Get-Content -LiteralPath $legacyInstallLog -Tail 180 | Write-Host
              }
              throw "Windows 0.2.22 MSI install failed with exit code $($legacyInstall.ExitCode)"
            }
            $legacyInstalled = $true

            $deadline = (Get-Date).AddSeconds(15)
            do {
              $service = Get-CimInstance Win32_Service -Filter "Name='BridgeAgent'" -ErrorAction SilentlyContinue
              if ($service -and $service.State -eq "Running") {
                break
              }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)

            if (-not $service) {
              throw "The 0.2.22 BridgeAgent service was not installed"
            }
            if ($service.State -ne "Running") {
              throw "The 0.2.22 BridgeAgent service is not running: $($service.State)"
            }

            Stop-Service -Name "BridgeAgent" -Force -ErrorAction Stop
            Get-Process -Name "bridge-agent-desktop" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not (Test-Path -LiteralPath $legacyDesktopExecutable)) {
              throw "The 0.2.22 desktop executable was not installed"
            }
            Move-Item `
              -LiteralPath $legacyDesktopExecutable `
              -Destination $legacyDesktopBackup `
              -Force

            if (-not (Test-Path -LiteralPath $configPath)) {
              throw "The 0.2.22 service did not initialize the shared config"
            }
            $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
            $config.platform.workspace_id = 999999
            $config.relay.url = "ws://127.0.0.1:9/ws/agent"
            $config.relay.token = "windows-upgrade-smoke-token"
            $config | ConvertTo-Json -Depth 100 |
              Set-Content -LiteralPath $configPath -Encoding utf8

            Start-Service -Name "BridgeAgent" -ErrorAction Stop

            $deadline = (Get-Date).AddSeconds(30)
            do {
              $legacyListener = Get-NetTCPConnection `
                -LocalAddress "127.0.0.1" `
                -LocalPort 18081 `
                -State Listen `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($legacyListener) {
                break
              }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if (-not $legacyListener) {
              throw "The 0.2.22 service did not bind 127.0.0.1:18081"
            }
            $service = Get-CimInstance Win32_Service -Filter "Name='BridgeAgent'"
            if ($legacyListener.OwningProcess -ne $service.ProcessId) {
              throw "Port 18081 is not owned by the legacy service process"
            }
            $legacyServicePid = [int]$service.ProcessId

            $upgrade = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList @("/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "AUTOLAUNCHAPP=True", "/L*v", "`"$upgradeLog`"") `
              -Wait `
              -PassThru
            if ($upgrade.ExitCode -notin @(0, 3010)) {
              if (Test-Path -LiteralPath $upgradeLog) {
                Get-Content -LiteralPath $upgradeLog -Tail 220 | Write-Host
              }
              throw "Windows desktop-owned MSI upgrade failed with exit code $($upgrade.ExitCode)"
            }
            $upgradeInstalled = $true

            $deadline = (Get-Date).AddSeconds(20)
            do {
              $service = Get-CimInstance Win32_Service -Filter "Name='BridgeAgent'" -ErrorAction SilentlyContinue
              $legacyServiceProcess = Get-Process -Id $legacyServicePid -ErrorAction SilentlyContinue
              if (-not $service -and -not $legacyServiceProcess) {
                break
              }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if ($service) {
              throw "The legacy BridgeAgent service remains after the upgrade"
            }
            if ($legacyServiceProcess) {
              throw "The legacy BridgeAgent service process remains after the upgrade"
            }
            if (Test-Path -LiteralPath $legacyServiceExecutable) {
              throw "The legacy service executable remains after the upgrade"
            }
            if (-not (Test-Path -LiteralPath $desktopExecutable)) {
              throw "The upgraded desktop executable was not found"
            }
            $installedUninstaller = "C:\Program Files\百积木\bridge-agent-uninstaller.exe"
            if (-not (Test-Path -LiteralPath $installedUninstaller)) {
              throw "The guided uninstaller was not installed"
            }
            foreach ($installedExecutable in @($desktopExecutable, $installedUninstaller)) {
              $installedSignature = Get-AuthenticodeSignature -LiteralPath $installedExecutable
              if ($installedSignature.Status -ne "Valid") {
                throw "Installed executable has an invalid Authenticode signature: $installedExecutable ($($installedSignature.Status))"
              }
            }
            if (Test-Path -LiteralPath $legacyDesktopExecutable) {
              throw "The legacy English product directory remains after the upgrade"
            }

            $upgradeListener = Get-NetTCPConnection `
              -LocalAddress "127.0.0.1" `
              -LocalPort 18081 `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($upgradeListener) {
              if ($upgradeListener.OwningProcess -eq $legacyServicePid) {
                throw "Port 18081 is still owned by the retired service process"
              }
              $upgradeOwner = Get-Process -Id $upgradeListener.OwningProcess -ErrorAction SilentlyContinue
              if (-not $upgradeOwner -or $upgradeOwner.ProcessName -ne "bridge-agent-desktop") {
                throw "Port 18081 is owned by an unexpected process after the upgrade"
              }
            }

            $desktopProcess = Get-Process -Name "bridge-agent-desktop" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $desktopProcess) {
              $desktopProcess = Start-Process -FilePath $desktopExecutable -PassThru
            }
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $userRunValue = Get-OptionalRegistryValue `
                -Hive ([Microsoft.Win32.Registry]::CurrentUser) `
                -SubKey $userRunSubKey `
                -Name "BaijimuBridgeAgent"
              $desktopListener = Get-NetTCPConnection `
                -LocalAddress "127.0.0.1" `
                -LocalPort 18081 `
                -State Listen `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($userRunValue -and $desktopListener) {
                break
              }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if ($userRunValue -notlike "*bridge-agent-desktop.exe*") {
              throw "The current-user desktop login startup entry was not registered: $userRunValue"
            }
            if (-not $desktopListener) {
              throw "The desktop-owned runtime did not bind 127.0.0.1:18081"
            }
            if ($desktopListener.OwningProcess -ne $desktopProcess.Id) {
              throw "Port 18081 is not owned by the desktop process"
            }

            $desktopCount = @(Get-Process -Name "bridge-agent-desktop" -ErrorAction SilentlyContinue).Count
            if ($desktopCount -ne 1) {
              throw "Expected one desktop runtime owner, found $desktopCount"
            }

            $quitRequest = Start-Process `
              -FilePath $desktopExecutable `
              -ArgumentList "--quit-running-instance" `
              -Wait `
              -PassThru
            if ($quitRequest.ExitCode -ne 0) {
              throw "The desktop quit request failed with exit code $($quitRequest.ExitCode)"
            }
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $desktopStillRunning = Get-Process -Name "bridge-agent-desktop" -ErrorAction SilentlyContinue
              $desktopListener = Get-NetTCPConnection -LocalPort 18081 -State Listen -ErrorAction SilentlyContinue
              if (-not $desktopStillRunning -and -not $desktopListener) {
                break
              }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if ($desktopStillRunning) {
              throw "The desktop process did not exit through the shared tray quit path"
            }
            if ($desktopListener) {
              throw "Port 18081 remains occupied after the desktop exited"
            }
            if (Get-Service -Name "BridgeAgent" -ErrorAction SilentlyContinue) {
              throw "The retired service reappeared after the desktop exited"
            }

            Write-Host "Verified 0.2.22 service-to-desktop upgrade, login startup, single runtime ownership, and graceful exit"
          } finally {
            Get-Process -Name "bridge-agent-desktop" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if ($upgradeInstalled) {
              $uninstall = Start-Process `
                -FilePath "msiexec.exe" `
                -ArgumentList @("/x", "`"$($msi.FullName)`"", "/qn", "/norestart", "/L*v", "`"$uninstallLog`"") `
                -Wait `
                -PassThru
              if ($uninstall.ExitCode -notin @(0, 1605, 3010)) {
                if (Test-Path -LiteralPath $uninstallLog) {
                  Get-Content -LiteralPath $uninstallLog -Tail 120 | Write-Host
                }
                throw "Windows MSI uninstall smoke test failed with exit code $($uninstall.ExitCode)"
              }
              $userRunAfterUninstall = Get-OptionalRegistryValue `
                -Hive ([Microsoft.Win32.Registry]::CurrentUser) `
                -SubKey $userRunSubKey `
                -Name "BaijimuBridgeAgent"
              if ($null -ne $userRunAfterUninstall) {
                throw "The current-user desktop login startup entry remained after MSI uninstall"
              }
            } elseif ($legacyInstalled) {
              Start-Process `
                -FilePath "msiexec.exe" `
                -ArgumentList @("/x", "`"$($legacyMsi.FullName)`"", "/qn", "/norestart") `
                -Wait `
                -ErrorAction SilentlyContinue | Out-Null
            }
            $cleanupRunKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey($userRunSubKey)
            try {
              $cleanupRunKey.DeleteValue("BaijimuBridgeAgent", $false)
            } finally {
              $cleanupRunKey.Dispose()
            }
            Remove-Item -LiteralPath $legacyDesktopBackup -Force -ErrorAction SilentlyContinue
          }

          if (Get-Service -Name "BridgeAgent" -ErrorAction SilentlyContinue) {
            throw "BridgeAgent service remained after MSI uninstall"
          }
          if (Test-Path -LiteralPath "C:\Program Files\Baijimu\bridge-agent-service.exe") {
            throw "BridgeAgent service executable remained after MSI uninstall"
          }
          if (Test-Path -LiteralPath "C:\Program Files\百积木\bridge-agent-desktop.exe") {
            throw "The 百积木 desktop executable remained after MSI uninstall"
          }
          if (-not (Test-Path -LiteralPath $configPath)) {
            throw "Standard MSI uninstall removed device configuration that should be preserved"
          }
          Write-Host "Verified Windows desktop-owned MSI uninstall lifecycle"

      - name: Smoke test Windows guided full uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/msi" `
            -Filter "*.msi" `
            -File `
            -ErrorAction Stop | Select-Object -First 1
          if (-not $msi) {
            throw "Windows MSI artifact was not found for full uninstall smoke test"
          }

          $installLog = Join-Path $env:RUNNER_TEMP "baijimu-full-uninstall-install.log"
          $install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @("/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "AUTOLAUNCHAPP=True", "/L*v", "`"$installLog`"") `
            -Wait `
            -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content -LiteralPath $installLog -Tail 160 -ErrorAction SilentlyContinue | Write-Host
            throw "Windows MSI reinstall failed with exit code $($install.ExitCode)"
          }

          $desktopExecutable = "C:\Program Files\百积木\bridge-agent-desktop.exe"
          $uninstaller = "C:\Program Files\百积木\bridge-agent-uninstaller.exe"
          $programData = "C:\ProgramData\Baijimu\BridgeAgent"
          $roamingData = Join-Path $env:APPDATA "baijimu\bridge-agent"
          $tauriData = Join-Path $env:LOCALAPPDATA "com.baijimu.bridgeagent"
          $managedCliRoot = Join-Path $env:LOCALAPPDATA "Baijimu\apps\com.baijimu.cli"
          $managedBin = Join-Path $env:LOCALAPPDATA "Baijimu\bin"
          $managedLauncher = Join-Path $managedBin "baijimu.exe"

          $deadline = (Get-Date).AddSeconds(45)
          do {
            $desktop = Get-Process -Name "bridge-agent-desktop" -ErrorAction SilentlyContinue
            if (
              $desktop -and
              (Test-Path -LiteralPath $uninstaller) -and
              (Test-Path -LiteralPath $managedLauncher)
            ) {
              break
            }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (-not $desktop) {
            throw "Desktop did not start before guided full uninstall"
          }
          if (-not (Test-Path -LiteralPath $uninstaller)) {
            throw "Guided uninstaller was not installed"
          }
          if (-not (Test-Path -LiteralPath $managedLauncher)) {
            throw "Managed CLI was not installed before full uninstall"
          }

          New-Item -ItemType Directory -Path $roamingData, $tauriData -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $roamingData "full-uninstall-marker.txt") -Value "remove me"
          Set-Content -LiteralPath (Join-Path $tauriData "full-uninstall-marker.txt") -Value "remove me"
          Set-Content -LiteralPath (Join-Path $programData "full-uninstall-marker.txt") -Value "remove me"

          $request = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @("--full", "--quiet") `
            -Wait `
            -PassThru
          if ($request.ExitCode -ne 0) {
            throw "Guided uninstall launcher failed with exit code $($request.ExitCode)"
          }

          $deadline = (Get-Date).AddSeconds(90)
          do {
            if (-not (Test-Path -LiteralPath $desktopExecutable)) {
              break
            }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (Test-Path -LiteralPath $desktopExecutable) {
            throw "Desktop executable remained after guided full uninstall"
          }
          foreach ($path in @($programData, $roamingData, $tauriData, $managedCliRoot, $managedLauncher)) {
            if (Test-Path -LiteralPath $path) {
              throw "Full uninstall left managed data behind: $path"
            }
          }
          $userRun = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Software\Microsoft\Windows\CurrentVersion\Run")
          try {
            if ($userRun -and $null -ne $userRun.GetValue("BaijimuBridgeAgent", $null)) {
              throw "Full uninstall left the login startup entry behind"
            }
          } finally {
            if ($userRun) { $userRun.Dispose() }
          }
          $userEnvironment = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Environment")
          try {
            $userPath = if ($userEnvironment) { [string]$userEnvironment.GetValue("Path", "") } else { "" }
            $managedBinPattern = [Regex]::Escape($managedBin.TrimEnd('\'))
            if ($userPath -match "(?i)(^|;)$managedBinPattern[\\/]*(;|$)") {
              throw "Full uninstall left the Baijimu managed bin directory in the user PATH"
            }
          } finally {
            if ($userEnvironment) { $userEnvironment.Dispose() }
          }
          Write-Host "Verified Windows guided full uninstall and managed data cleanup"

      - name: Upload bundles to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ matrix.name }}
        run: |
          set -euo pipefail

          retry_gh() {
            local attempt delay
            for attempt in $(seq 1 20); do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "GitHub CLI command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              delay=$((attempt * 5))
              if [ "$delay" -gt 60 ]; then
                delay=60
              fi
              echo "GitHub CLI command failed; retrying in ${delay} seconds (${attempt}/20): $*" >&2
              sleep "$delay"
            done
          }

          release_notes="$(mktemp)"
          cat > "$release_notes" <<'NOTES'
          百积木桌面端发布。

          Download the installer for your platform from the Assets section below:
          - macOS: universal `.dmg` (works on both Intel and Apple Silicon)
          - Windows: `.msi` installer that downloads WebView2 only when it is missing
          - Linux: `.AppImage` / `.deb` / archive

          This release is built automatically by GitHub Actions from the tagged source.
          NOTES

          release_create_args=(
            "$RELEASE_TAG"
            --verify-tag
            --title "百积木 $RELEASE_TAG"
            --notes-file "$release_notes"
          )
          case "$RELEASE_TAG" in
            *-alpha*|*-beta*|*-rc*) release_create_args+=(--prerelease) ;;
          esac

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            retry_gh gh release create "${release_create_args[@]}" \
              || retry_gh gh release view "$RELEASE_TAG" >/dev/null
          fi

          shopt -s nullglob
          case "$RELEASE_TARGET" in
            "macOS Universal")
              bundle_files=(
                src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
                src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
                src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              )
              ;;
            "Windows x64")
              bundle_files=(
                src-tauri/target/release/bundle/msi/*.msi
                src-tauri/target/release/bundle/msi/*.msi.sig
              )
              ;;
            "Linux x64")
              bundle_files=(
                src-tauri/target/release/bundle/appimage/*.AppImage
                src-tauri/target/release/bundle/appimage/*.AppImage.sig
                src-tauri/target/release/bundle/deb/*.deb
              )
              ;;
            *)
              echo "Unsupported release target: $RELEASE_TARGET" >&2
              exit 1
              ;;
          esac

          if [ "${#bundle_files[@]}" -eq 0 ]; then
            echo "No release bundles found for $RELEASE_TARGET" >&2
            exit 1
          fi

          for asset in "${bundle_files[@]}"; do
            retry_gh gh release upload "$RELEASE_TAG" "$asset" --clobber
          done

  mirror-domestic-release:
    name: Mirror release bundles to Gitee
    runs-on: ubuntu-22.04
    needs: [prepare-domestic-release, release]
    if: >-
      ${{
        always()
        && needs.prepare-domestic-release.result == 'success'
        && (
          needs.release.result == 'success'
          || (
            github.event_name == 'workflow_dispatch'
            && inputs.repair_assets_only
            && needs.release.result == 'skipped'
          )
        )
      }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Download signed release bundles from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'Baijimu_*'

      - name: Upload release bundles to OSS and register metadata
        shell: bash
        env:
          BRIDGE_AGENT_RELEASE_API_URL: ${{ secrets.BRIDGE_AGENT_RELEASE_API_URL }}
          BRIDGE_AGENT_RELEASE_API_TOKEN: ${{ secrets.BRIDGE_AGENT_RELEASE_API_TOKEN }}
        run: |
          set -euo pipefail

          for name in BRIDGE_AGENT_RELEASE_API_URL BRIDGE_AGENT_RELEASE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          api="$(node .github/scripts/release-service-url.mjs release "$BRIDGE_AGENT_RELEASE_API_URL")"
          version="${RELEASE_TAG#bridge-agent-v}"

          upload_asset() {
            local target="$1"
            local asset="$2"
            local signature="${asset}.sig"
            if [ ! -s "$asset" ]; then
              echo "Missing release bundle: $asset" >&2
              exit 1
            fi
            if [ -s "$signature" ]; then
              node .github/scripts/upload-oss-release-asset.mjs \
                "$api" "$RELEASE_TAG" "$version" "$target" "$asset" "$signature"
            else
              node .github/scripts/upload-oss-release-asset.mjs \
                "$api" "$RELEASE_TAG" "$version" "$target" "$asset"
            fi
          }

          shopt -s nullglob
          windows=(release-assets/*.msi)
          macos_tar=(release-assets/*.app.tar.gz)
          macos_dmg=(release-assets/*.dmg)
          linux_deb=(release-assets/*.deb)
          linux_appimage=(release-assets/*.AppImage)
          if [ "${#windows[@]}" -ne 1 ] ||
             [ "${#macos_tar[@]}" -ne 1 ] ||
             [ "${#macos_dmg[@]}" -ne 1 ] ||
             [ "${#linux_deb[@]}" -ne 1 ] ||
             [ "${#linux_appimage[@]}" -ne 1 ]; then
            echo "Expected exactly one release bundle for each published format" >&2
            find release-assets -maxdepth 1 -type f -print | sort
            exit 1
          fi

          node .github/scripts/register-release-manifest.mjs \
            "$api" "$RELEASE_TAG" \
            "Windows x64::${windows[0]}::true" \
            "macOS Universal::${macos_tar[0]}::true" \
            "macOS Universal::${macos_dmg[0]}::false" \
            "Linux x64::${linux_deb[0]}::false" \
            "Linux x64::${linux_appimage[0]}::true"

          upload_asset "Windows x64" "${windows[0]}"
          upload_asset "macOS Universal" "${macos_tar[0]}"
          upload_asset "macOS Universal" "${macos_dmg[0]}"
          upload_asset "Linux x64" "${linux_deb[0]}"
          upload_asset "Linux x64" "${linux_appimage[0]}"

  verify-update-service:
    name: Verify automatically published update metadata
    runs-on: ubuntu-22.04
    needs: mirror-domestic-release
    if: >-
      ${{
        always()
        && needs.mirror-domestic-release.result == 'success'
      }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            bridge-agent-v*) ;;
            *)
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
      - name: Verify published updater metadata and public downloads
        shell: bash
        env:
          BRIDGE_AGENT_UPDATE_API_URL: ${{ secrets.BRIDGE_AGENT_UPDATE_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "$BRIDGE_AGENT_UPDATE_API_URL" ]; then
            echo "Missing required secret: BRIDGE_AGENT_UPDATE_API_URL" >&2
            exit 1
          fi
          latest_api="$(node .github/scripts/release-service-url.mjs update "$BRIDGE_AGENT_UPDATE_API_URL")"
          version="${RELEASE_TAG#bridge-agent-v}"

          latest_payload="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 \
            "${latest_api}?currentVersion=0.0.0")"
          jq -e --arg version "$version" '
            .version == $version
            and (.assets | length == 5)
            and all(.assets[];
              .provider == "baijimu-oss"
              and (.downloadUrl
                | test("^https://download\\.baijimu\\.com/lowcode/direct-uploads/bridge-agent-release/"))
            )
          ' <<<"$latest_payload" >/dev/null

          for target_arch in darwin:aarch64 windows:x86_64 linux:x86_64; do
            target="${target_arch%%:*}"
            arch="${target_arch#*:}"
            updater_payload="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 \
              "${latest_api}/tauri?target=${target}&arch=${arch}&currentVersion=0.0.0")"
            updater_url="$(jq -er --arg version "$version" '
              select(.version == $version)
              | select(.signature | length > 0)
              | .url
              | select(test("^https://download\\.baijimu\\.com/lowcode/direct-uploads/bridge-agent-release/"))
            ' <<<"$updater_payload")"
            curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --range 0-0 --max-time 120 \
              --output /dev/null "$updater_url"
          done
