name: release-bridge-agent

on:
  push:
    tags:
      - "bridge-agent-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry or repair, for example bridge-agent-v0.1.110
        required: true
        type: string
      repair_assets_only:
        description: Reuse the existing signed GitHub Release assets and repair OSS distribution and updater metadata
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bridge-agent-release
  cancel-in-progress: false

jobs:
  frontend-recovery-gate:
    name: Release frontend recovery (${{ matrix.runner }})
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_assets_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-latest]
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - uses: ./.github/actions/frontend-recovery

  prepare-domestic-release:
    name: Prepare domestic release
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Validate immutable release source
        shell: bash
        env:
          REPAIR_ASSETS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_assets_only || false }}
        run: bash .github/scripts/release-steps/01-validate-immutable-release-source.sh
      - name: Upsert domestic release
        shell: bash
        env:
          BRIDGE_AGENT_RELEASE_API_URL: ${{ secrets.BRIDGE_AGENT_RELEASE_API_URL }}
          BRIDGE_AGENT_RELEASE_API_TOKEN: ${{ secrets.BRIDGE_AGENT_RELEASE_API_TOKEN }}
        run: bash .github/scripts/release-steps/02-upsert-domestic-release.sh
  quality-gate:
    name: Release quality gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_assets_only }}
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          # A repair release is dispatched from the fixed main commit while keeping
          # the existing immutable release tag only as the artifact version.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Configure authenticated CModel dependency access
        shell: bash
        run: .github/scripts/configure-gitee-cargo.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust quality tools
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Install Tauri Linux dependencies
        run: .github/scripts/install-linux-release-dependencies.sh

      - name: Run release checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run quality

  windows-quality-gate:
    name: Windows release quality gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_assets_only }}
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Configure authenticated CModel dependency access
        shell: bash
        run: .github/scripts/configure-gitee-cargo.sh

      - name: Test Microsoft Defender signature update retries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "src-tauri/scripts/update-defender-signatures.test.ps1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust quality tools
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Build frontend for Tauri context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          $env:TAURI_ENV_PLATFORM = "windows"
          npm run prepare:windows-uninstaller:quality

      - name: Check Windows Rust targets
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/03-check-windows-rust-targets.ps1
  release:
    name: ${{ matrix.name }}
    needs: [prepare-domestic-release, quality-gate, windows-quality-gate, frontend-recovery-gate]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_assets_only }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            runner: macos-15-intel
            tauri_args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            tauri_args: --bundles msi
            rust_targets: ""
          - name: Linux x64
            runner: ubuntu-22.04
            tauri_args: --bundles appimage,deb
            rust_targets: ""
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Repair releases build the dispatched main commit, not the old tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Configure authenticated CModel dependency access
        shell: bash
        run: .github/scripts/configure-gitee-cargo.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-release-dependencies.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare bundled Baijimu CLI
        shell: bash
        env:
          BAIJIMU_CLI_USE_RELEASE_ASSET: "true"
        run: |
          set -euo pipefail
          ./tools/baijimu-cli/prepare-bundled-cli.sh

      - name: Prepare unified app ID migration artifact
        shell: bash
        run: bash .github/scripts/release-steps/04-prepare-unified-app-id-migration-artifact.sh
      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        run: |
          & ./.github/scripts/release-steps/05-configure-windows-signing.ps1
      - name: Prepare Windows signing tools
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/06-prepare-windows-signing-tools.ps1
      - name: Sign unified app ID migration artifact on Windows
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          WINDOWS_SIGNING_ENABLED: "true"
          WINDOWS_SIGNING_DESCRIPTION: "百积木"
          WINDOWS_SIGNING_LOG_PATH: ${{ runner.temp }}/windows-signing.log
        run: |
          $ErrorActionPreference = "Stop"
          & "src-tauri/scripts/sign-windows-artifact.ps1" -FilePath "src-tauri/resources/bin/bridge-agent-unified-app-id-migration.exe"

      - name: Prepare Apple notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Sign bundled macOS resource binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Xiaofeng Zhang (H82D8SYZ94)"
        run: bash .github/scripts/release-steps/07-sign-bundled-macos-resource-binaries.sh
      - name: Validate release tag
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            bridge-agent-v*) ;;
            *)
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

      - name: Validate release service config
        shell: bash
        env:
          BRIDGE_AGENT_UPDATE_API_URL: ${{ secrets.BRIDGE_AGENT_UPDATE_API_URL }}
          BRIDGE_AGENT_RELEASE_API_URL: ${{ secrets.BRIDGE_AGENT_RELEASE_API_URL }}
          BRIDGE_AGENT_RELEASE_API_TOKEN: ${{ secrets.BRIDGE_AGENT_RELEASE_API_TOKEN }}
        run: bash .github/scripts/release-steps/08-validate-release-service-config.sh
      - name: Build release bundles
        id: build_release_bundles
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static -D warnings' || '-D warnings' }}
          BRIDGE_AGENT_UPDATE_API_URL: ${{ secrets.BRIDGE_AGENT_UPDATE_API_URL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Xiaofeng Zhang (H82D8SYZ94)"
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          WINDOWS_SIGNING_ENABLED: ${{ env.WINDOWS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_DESCRIPTION: "百积木"
          WINDOWS_SIGNING_LOG_PATH: ${{ runner.temp }}/windows-signing.log
          # Tauri otherwise adds --skip-jenkins whenever GitHub Actions sets
          # CI=true, which copies the background asset but omits the Finder
          # .DS_Store that applies the background and icon positions.
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required updater signing secret: $name" >&2
              exit 1
            fi
          done
          if [ "$RUNNER_OS" = "macOS" ]; then
            bash .github/scripts/tauri-build-with-notary-retry.sh \
              npm run tauri -- build ${{ matrix.tauri_args }}
          else
            npm run tauri -- build ${{ matrix.tauri_args }}
          fi

      - name: Diagnose Windows bundle failure
        if: ${{ failure() && runner.os == 'Windows' && steps.build_release_bundles.outcome == 'failure' }}
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/09-diagnose-windows-bundle-failure.ps1
      - name: Verify macOS minimum system version
        if: runner.os == 'macOS'
        shell: bash
        run: bash .github/scripts/release-steps/10-verify-macos-minimum-system-version.sh
      - name: Normalize public bundle names
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#bridge-agent-v}"

          normalize_one() {
            local label="$1"
            local expected_path="$2"
            shift 2
            local bundle_files=("$@")
            if [ "${#bundle_files[@]}" -eq 0 ]; then
              echo "No $label bundle found" >&2
              exit 1
            fi
            if [ "${#bundle_files[@]}" -gt 1 ]; then
              echo "Expected one $label bundle, found ${#bundle_files[@]}:" >&2
              printf ' - %s\n' "${bundle_files[@]}" >&2
              exit 1
            fi
            if [ "${bundle_files[0]}" != "$expected_path" ]; then
              source_signature="${bundle_files[0]}.sig"
              mv "${bundle_files[0]}" "$expected_path"
              if [ -f "$source_signature" ]; then
                mv "$source_signature" "${expected_path}.sig"
              fi
            fi
            test -f "$expected_path"
          }

          shopt -s nullglob
          case "${{ runner.os }}" in
            macOS)
              bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
              normalize_one "macOS dmg" \
                "$bundle_dir/Baijimu_${version}_universal.dmg" \
                "$bundle_dir"/*.dmg
              updater_dir="src-tauri/target/universal-apple-darwin/release/bundle/macos"
              normalize_one "macOS updater" \
                "$updater_dir/Baijimu_${version}_universal.app.tar.gz" \
                "$updater_dir"/*.app.tar.gz
              test -s "$updater_dir/Baijimu_${version}_universal.app.tar.gz.sig"
              ;;
            Windows)
              bundle_dir="src-tauri/target/release/bundle/msi"
              normalize_one "Windows msi" \
                "$bundle_dir/Baijimu_${version}_x64_zh-CN.msi" \
                "$bundle_dir"/*.msi
              test -s "$bundle_dir/Baijimu_${version}_x64_zh-CN.msi.sig"
              ;;
            Linux)
              appimage_dir="src-tauri/target/release/bundle/appimage"
              deb_dir="src-tauri/target/release/bundle/deb"
              normalize_one "Linux AppImage" \
                "$appimage_dir/Baijimu_${version}_amd64.AppImage" \
                "$appimage_dir"/*.AppImage
              test -s "$appimage_dir/Baijimu_${version}_amd64.AppImage.sig"
              normalize_one "Linux deb" \
                "$deb_dir/Baijimu_${version}_amd64.deb" \
                "$deb_dir"/*.deb
              ;;
            *)
              echo "Unsupported runner OS: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac

      - name: Verify Windows MSI desktop-owned runtime contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/11-verify-windows-msi-desktop-owned-runtime-contract.ps1
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/12-verify-windows-signatures.ps1
      - name: Scan signed Windows release with Microsoft Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/13-scan-signed-windows-release-with-microsoft-defender.ps1
      - name: Verify Windows executables are self-contained
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/14-verify-windows-executables-are-self-contained.ps1
      - name: Smoke test Windows service-to-desktop upgrade lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & ./.github/scripts/release-steps/15-smoke-test-windows-service-to-desktop-upgrade-lifecycle.ps1
      - name: Smoke test Windows guided full uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/16-smoke-test-windows-guided-full-uninstall.ps1
      - name: Smoke test Windows external white-screen repair preserves data
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & ./.github/scripts/release-steps/16-smoke-test-windows-white-screen-repair.ps1
      - name: Upload bundles to GitHub release
        # Public assets are uploaded only after upgrade/recovery regression tests pass.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ matrix.name }}
        run: bash .github/scripts/release-steps/17-upload-bundles-to-github-release.sh
  mirror-domestic-release:
    name: Mirror release bundles to Gitee
    runs-on: ubuntu-22.04
    needs: [prepare-domestic-release, release]
    if: >-
      ${{
        always()
        && needs.prepare-domestic-release.result == 'success'
        && (
          needs.release.result == 'success'
          || (
            github.event_name == 'workflow_dispatch'
            && inputs.repair_assets_only
            && needs.release.result == 'skipped'
          )
        )
      }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Download signed release bundles from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'Baijimu_*'

      - name: Upload release bundles to OSS and register metadata
        shell: bash
        env:
          BRIDGE_AGENT_RELEASE_API_URL: ${{ secrets.BRIDGE_AGENT_RELEASE_API_URL }}
          BRIDGE_AGENT_RELEASE_API_TOKEN: ${{ secrets.BRIDGE_AGENT_RELEASE_API_TOKEN }}
        run: bash .github/scripts/release-steps/18-upload-release-bundles-to-oss-and-register-metadata.sh
  verify-update-service:
    name: Verify automatically published update metadata
    runs-on: ubuntu-22.04
    needs: mirror-domestic-release
    if: >-
      ${{
        always()
        && needs.mirror-domestic-release.result == 'success'
      }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            bridge-agent-v*) ;;
            *)
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
      - name: Verify published updater metadata and public downloads
        shell: bash
        env:
          BRIDGE_AGENT_UPDATE_API_URL: ${{ secrets.BRIDGE_AGENT_UPDATE_API_URL }}
        run: bash .github/scripts/release-steps/19-verify-published-updater-metadata-and-public-downloads.sh
