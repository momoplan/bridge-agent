name: migrate-codex-release-secrets

on:
  push:
    branches:
      - "codex/remove-codex-release-ownership"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.MIGRATION_ADMIN_TOKEN }}
      TARGET_REPOSITORY: momoplan/baijimu-connector-codex
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
      SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
      SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
      SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
    steps:
      - name: Copy release secrets directly into the Connector repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            OSS_ACCESS_KEY_ID \
            OSS_ACCESS_KEY_SECRET \
            SSL_COM_USERNAME \
            SSL_COM_PASSWORD \
            SSL_COM_CREDENTIAL_ID \
            SSL_COM_TOTP_SECRET; do
            value="${!name}"
            test -n "$value" || { echo "Missing source secret: $name" >&2; exit 1; }
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET_REPOSITORY"
          done
