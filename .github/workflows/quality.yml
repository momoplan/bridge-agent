name: quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-recovery:
    name: Frontend recovery (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-latest]
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/frontend-recovery

  rust-architecture:
    name: Rust architecture and quality
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure authenticated CModel dependency access
        shell: bash
        run: .github/scripts/configure-gitee-cargo.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust quality tools
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Install Tauri Linux dependencies
        run: .github/scripts/install-linux-release-dependencies.sh

      - name: Run application and Rust quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run quality

  windows-quality:
    name: Windows architecture and quality
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure authenticated CModel dependency access
        shell: bash
        run: .github/scripts/configure-gitee-cargo.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust quality tools
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Prepare Windows frontend and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          $env:TAURI_ENV_PLATFORM = "windows"
          npm run prepare:windows-uninstaller:quality

      - name: Run Windows Rust quality gates
        shell: pwsh
        run: |
          & ./.github/scripts/release-steps/03-check-windows-rust-targets.ps1
