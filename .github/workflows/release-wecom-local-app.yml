name: release-wecom-local-app

on:
  push:
    tags:
      - "wecom-local-app-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag, for example wecom-local-app-v1.0.2
        required: true
        type: string
      connector_ref:
        description: wecom-bridge-collector tag, for example v1.0.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            wecom-local-app-v*) ;;
            *) echo "Invalid WeCom local app release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            [ "$draft" = true ] || { echo "Release $RELEASE_TAG is already immutable" >&2; exit 1; }
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Baijimu WeCom Local App ${RELEASE_TAG#wecom-local-app-v}"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "Baijimu WeCom Local App ${RELEASE_TAG#wecom-local-app-v}" \
              --notes "Baijimu WeCom source local application release. Platform code signing is not applicable because these archives contain Python source rather than native executables."
          fi

  python-compatibility:
    needs: prepare-release
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      CONNECTOR_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.connector_ref || format('v{0}', github.ref_name) }}
    steps:
      - name: Resolve connector ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "CONNECTOR_REF=v${RELEASE_TAG#wecom-local-app-v}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout and test Connector
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.BAIJIMU_CLI_RS_GIT_TOKEN }}
        run: |
          set -euo pipefail
          : "${GITEE_TOKEN:?BAIJIMU_CLI_RS_GIT_TOKEN is required}"
          git clone --depth 1 --branch "$CONNECTOR_REF" \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/zxflimit_admin/wecom-bridge-collector.git" \
            "$RUNNER_TEMP/wecom-bridge-collector"
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/wecom-bridge-collector/requirements.lock"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/wecom-bridge-collector"
          python -m unittest discover -s "$RUNNER_TEMP/wecom-bridge-collector/tests"
          python -c 'import importlib.metadata,sys; print(sys.version); print(importlib.metadata.version("wecom-bridge-collector"))'

  build:
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runner: macos-15-intel
          - name: windows-universal
            runner: windows-latest
          - name: linux-universal
            runner: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      CONNECTOR_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.connector_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve connector ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "CONNECTOR_REF=v${RELEASE_TAG#wecom-local-app-v}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Checkout WeCom local app source
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.BAIJIMU_CLI_RS_GIT_TOKEN }}
        run: |
          set -euo pipefail
          : "${GITEE_TOKEN:?BAIJIMU_CLI_RS_GIT_TOKEN is required}"
          git clone --depth 1 --branch "$CONNECTOR_REF" \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/zxflimit_admin/wecom-bridge-collector.git" \
            "$RUNNER_TEMP/wecom-bridge-collector"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$RUNNER_TEMP/wecom-bridge-collector/pyproject.toml" | head -1)"
          if [ "wecom-local-app-v${version}" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match Connector version $version" >&2
            exit 1
          fi
          if [ "v${version}" != "$CONNECTOR_REF" ]; then
            echo "Connector ref $CONNECTOR_REF does not match Connector version $version" >&2
            exit 1
          fi
          grep -Fx 'requires-python = ">=3.10"' "$RUNNER_TEMP/wecom-bridge-collector/pyproject.toml"
          echo "CONNECTOR_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test package on release platform
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/wecom-bridge-collector"
          python -m pip install --disable-pip-version-check -r "$source_dir/requirements.lock"
          python -m pip install --disable-pip-version-check "$source_dir"
          python -m unittest discover -s "$source_dir/tests"

      - name: Assemble and verify source package
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/wecom-bridge-collector"
          output="$RUNNER_TEMP/baijimu-wecom-local-app-${CONNECTOR_VERSION}-${{ matrix.name }}.zip"
          git -C "$source_dir" archive --format=zip --output="$output" "$CONNECTOR_REF"
          python - "$output" "$CONNECTOR_VERSION" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]
          with zipfile.ZipFile(archive) as package:
              manifest = json.loads(package.read("connector.json"))
              pyproject = package.read("pyproject.toml").decode()
          if manifest["id"] != "com.baijimu.connector.wecom":
              raise SystemExit("unexpected Connector identity")
          if manifest["version"] != expected_version or manifest["source"]["revision"] != f"v{expected_version}":
              raise SystemExit("Connector version or revision mismatch")
          if 'requires-python = ">=3.10"' not in pyproject or ">=3.12,<3.13" in pyproject:
              raise SystemExit("unexpected Python compatibility contract")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix(archive.suffix + ".sha256").write_text(f"{digest}  {archive.name}\n")
          PY
          echo "RELEASE_ASSET=$output" >> "$GITHUB_ENV"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    needs:
      - python-compatibility
      - build
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
