<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <image href="dmg-background-base.png" width="660" height="400" preserveAspectRatio="xMidYMid slice" />
  <rect x="0" y="0" width="660" height="400" fill="#f8fafc" opacity="0.18" />

  <text x="330" y="52" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif"
